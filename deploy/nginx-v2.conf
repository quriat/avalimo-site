server {
    listen 5002;
    server_name _;

    client_max_body_size 10m;

    # Emit relative Location on redirects so the public scheme/host are preserved
    # (nginx otherwise leaks the internal :5002 port and http:// behind Coolify's TLS proxy)
    absolute_redirect off;
    port_in_redirect off;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    # React SPA build output (the single, new design)
    root /app/site;
    index index.html;

    # Vite hashed assets & favicon — served straight from disk
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location = /favicon.svg {
        try_files $uri =404;
    }

    # Flask backend: API, fleet images, payment, sitemap, robots, legal policy
    location ~ ^/(api|static)/ {
        proxy_pass http://127.0.0.1:5003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ ^/(deposit|policy|sitemap\.xml|robots\.txt) {
        proxy_pass http://127.0.0.1:5003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Legal aliases (were 404s) -> policy
    location = /privacy { return 301 /policy; }
    location = /terms   { return 301 /policy; }

    # 301 old-design landing pages -> new SPA sections (merge to one design)
    location ~ ^/(pricing|faq|flight-status|airport-iah|airport-hobby|airport-24-7-service|iah-airport-car-service|hobby-airport-car-service|galveston-cruise-transport|houston-to-galveston-cruise-transfer|locations/galveston)$ {
        return 301 /#rates-section;
    }
    location ~ ^/(fleet|fleet/.+)$ {
        return 301 /#fleet-section;
    }
    location ~ ^/(book|contact|book-your-ride)$ {
        return 301 /#booking-section;
    }
    location ~ ^/(services|wedding-limo|houston-wedding-limo|prom-limo|houston-prom-limo|quinceanera-limo|bachelorette-party|new-years-eve-limo|event-transportation|corporate-transportation|houston-corporate-car-service|black-car-service|chauffeur-service|party-bus|wine-tours|medical-center-limo)$ {
        return 301 /#services-section;
    }

    # Everything else -> SPA (new design). Blog routes render inside it.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
