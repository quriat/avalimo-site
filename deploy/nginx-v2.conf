server {
    listen 5002;
    server_name _;

    client_max_body_size 10m;

    # Emit relative Location on redirects so the public scheme/host are preserved
    # (nginx otherwise leaks the internal :5002 port and http:// behind Coolify's TLS proxy)
    absolute_redirect off;
    port_in_redirect off;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    # Hybrid: React SPA homepage + Flask old-design SEO landing pages
    root /app/site;
    index index.html;

    # Vite hashed assets & favicon — served straight from disk
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location = /favicon.svg {
        try_files $uri =404;
    }

    # Flask backend: API, fleet images, payment, sitemap, robots, legal policy
    # + old-design SEO landing pages (hybrid: SPA is homepage, Flask is landing pages)
    location ~ ^/(api|static)/ {
        proxy_pass http://127.0.0.1:5003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ ^/(deposit|policy|pricing|faq|flight-status|services|fleet|book|contact|sitemap\.xml|robots\.txt) {
        proxy_pass http://127.0.0.1:5003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Old-design SEO landing pages -> Flask (return 200 with rich content)
    location ~ ^/(airport-iah|airport-hobby|airport-24-7-service|wedding-limo|prom-limo|quinceanera-limo|corporate-transportation|black-car-service|chauffeur-service|party-bus|event-transportation|bachelorette-party|galveston-cruise-transport|wine-tours|new-years-eve-limo|locations/galveston|fleet/mercedes-s-class|fleet/cadillac-escalade|fleet/mercedes-sprinter)(/)?$ {
        proxy_pass http://127.0.0.1:5003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Legal aliases (were 404s) -> policy
    location = /privacy { return 301 /policy; }
    location = /terms   { return 301 /policy; }

    # Alias slugs -> canonical Flask landing pages (preserve link equity,
    # instead of dumping to SPA #sections)
    location = /iah-airport-car-service { return 301 /airport-iah; }
    location = /hobby-airport-car-service { return 301 /airport-hobby; }
    location = /houston-wedding-limo { return 301 /wedding-limo; }
    location = /houston-prom-limo { return 301 /prom-limo; }
    location = /houston-corporate-car-service { return 301 /corporate-transportation; }
    location = /houston-to-galveston-cruise-transfer { return 301 /galveston-cruise-transport; }
    location = /medical-center-limo { return 301 /services; }
    location = /book-your-ride { return 301 /book; }

    # Everything else -> SPA (new design). Blog routes render inside it.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
